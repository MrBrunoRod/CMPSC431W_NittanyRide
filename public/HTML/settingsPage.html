<!DOCTYPE html>
<html lang="en">
<head>

    <title>Settings</title>
    <script src="../JavaScript/settings.js" defer></script>

</head>
<body>

        <h2 class = "mid">Settings</h2>

        </section>

        <nav aria-label="Main">
        <a id="return-link" href="index.html">Return</a>
        <a href="index.html">Log Out</a>
        </nav>
    </main>

</html>
